<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- TNG50 galaxy explorer icon: a tilted gas disk (hot core to cool halo) crossed by a quasar sightline -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7b3fd0" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7b3fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".22" stop-color="#ffc35a"/>
      <stop offset=".5" stop-color="#ff6a3d"/>
      <stop offset=".78" stop-color="#c2338f"/>
      <stop offset="1" stop-color="#c2338f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05070b"/>
  <ellipse cx="33" cy="33" rx="25" ry="20" fill="url(#halo)" transform="rotate(28 33 33)"/>
  <ellipse cx="33" cy="33" rx="20" ry="7" fill="url(#disk)" transform="rotate(28 33 33)"/>
  <line x1="5" y1="52" x2="60" y2="11" stroke="#fff4df" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="60" cy="11" r="2.4" fill="#fff4df"/>
</svg>
