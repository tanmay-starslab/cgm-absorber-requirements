<!--
  The film of the v2 story (DESIGN §11, DESIGN_final §5.9; owner brief item 7). A HyperFrames composition and a CDP frame
  source (scripts/story_stills.mjs): both call window.__film.renderT(t). Nothing here draws its own physics or its own 3D:
  every frame is seek(p) (js/core/seek.js over beats.json + shots.json) -> the 3D stage (js/stage/stage.js) -> the shell's
  kinetic text, plaque and solver (js/ui/hud.js) -> the equations overlay (js/eq/equations.js) -> the spectrum dock.
  film.json picks the p range (whole beats) of each chunk, its duration, a transfer-function override, and the caption
  that names the parameter the chunk isolates (copy.json film.captions). Generated outputs only: never hand-edit the MP4.

  Deterministic frames (G8): every field the film uses is resident (L0 + L1) before frame 0; each output frame is a decoy
  pass + K accumulation passes with the stage's 64-frame jitter phase aligned to the frame index, the governor off and a
  fixed volume scale; no browser clock, transitions or animations; the noise seed comes from seek (B12b).

  Query / HyperFrames variables: g, ray, cut ("film" | "beams"), viz (manifest_v2 URL of the cubes; default the repo
  manifest), three (URL of three.module.min.js 0.169; default the explorer's CDN pin with SRI), burn (chunk captions;
  default on, as designed), requireGpu (fail on a software GL renderer), layers ("all" | "stage": the 3D only, for the
  AVIF stills), w, h (viewport), K (accumulation passes), scale (volume target), quality (stage quality ladder).

  The spectrum dock is U_spec's (js/spectrum/dock.js createDock); until it exists this page draws a film dock from the
  verified v1 physics in js/plot.js (per-cell Voigt tau, the yt kernel CDF of story-data/2 for the partial cells, the
  explorer's degradeV for R and S/N): same numbers, plainer look. When the integrator's js/main.js exports createScene(),
  this page uses it and only maps film time to p.
-->

<script type="module">
const root = document.getElementById("root"), failEl = document.getElementById("fail");
const fail = msg => { failEl.textContent = "render.html: " + msg; failEl.style.display = "block"; throw new Error(msg); };
const Q = new URLSearchParams(location.search);
const hf = window.__hyperframes || null;
function vars() {
  const d = Object.fromEntries(JSON.parse(root.dataset.compositionVariables || "[]").map(x => [x.id, x.default]));
  const v = hf && hf.getVariables ? {...d, ...hf.getVariables()} : d;
  const b = (k, x) => (Q.has(k) ? Q.get(k) !== "0" && Q.get(k) !== "false" : x);
  return {g: Q.get("g") || v.g, ray: Q.get("ray") || v.ray, cut: Q.get("cut") || v.cut || "film", viz: Q.get("viz") || v.viz || "",
          burn: b("burn", v.burn !== false), requireGpu: b("requireGpu", !!v.requireGpu), layers: Q.get("layers") || "all",
          w: +(Q.get("w") || 1920), h: +(Q.get("h") || 1080), scale: Q.has("scale") ? +Q.get("scale") : null, K: Q.has("K") ? +Q.get("K") : null,
          quality: Q.get("quality") || null};
}
const get = async u => { const r = await fetch(u, {cache: "no-store"}); if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.json(); };
const getBin = async (u, gz) => { const r = await fetch(u, {cache: "no-store"}); if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`);
  if (!gz) return r.arrayBuffer(); return new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer(); };
const smoother = x => { const t = x < 0 ? 0 : x > 1 ? 1 : x; return t * t * t * (t * (6 * t - 15) + 10); };
const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);

/* ------------------------------------------------------------------ film timeline (scripts/story_vtt.mjs mirrors it) */
function filmTimeline(film, beats, cut = "film") {
  const B = new Map(beats.map(b => [b.id, b])), fps = film.fps || 30, R = film.render || {};
  const C = film.cuts && film.cuts[cut];
  if (!C) throw new Error(`film.json has no cut "${cut}"`);
  const pick = C.chunks === "all" || !C.chunks ? film.chunks : film.chunks.filter(c => C.chunks.includes(c.id));
  let f = 0; const chunks = [];
  for (const c of pick) {
    const bs = c.beats.map(id => B.get(id)); if (bs.some(x => !x)) throw new Error(`chunk ${c.id}: unknown beat in ${c.beats}`);
    const n = Math.round(c.s * fps); if (Math.abs(n / fps - c.s) > 1e-6) throw new Error(`chunk ${c.id}: ${c.s} s is not a whole number of frames`);
    // the chunk's beats keep their Watch proportions (beats.json watch_s: reading time), scaled to the chunk's length
    // inside a beat the camera dwells where a text line is up (weight 1 + dwell) and moves on between lines
    const ws = bs.map(b => Math.max(0.1, +b.watch_s || (b.p1 - b.p0) * 300)), wt = ws.reduce((a, x) => a + x, 0), dwell = R.dwell ?? 3;
    let acc = 0; const knots = [{x: 0, p: bs[0].p0}];
    bs.forEach((b, i) => {
      const win = (b.text || []).filter(t => !t.when || t.when === "default").map(t => [Math.max(0, t.u0), Math.min(1, t.u1)]);
      const cuts = [...new Set([0, 1, ...win.flat()])].sort((x, y) => x - y);
      const seg = cuts.slice(1).map((u1, k) => { const u0 = cuts[k], m = (u0 + u1) / 2; return {u1, w: (u1 - u0) * (1 + (win.some(([a, z]) => m > a && m < z) ? dwell : 0))}; });
      const sw = seg.reduce((a, x) => a + x.w, 0) || 1;
      for (const g of seg) { acc += ws[i] / wt * g.w / sw; knots.push({x: acc, p: b.p0 + (b.p1 - b.p0) * g.u1}); }
    });
    chunks.push({...c, p0: bs[0].p0, p1: bs[bs.length - 1].p1, f0: f, f1: f + n, frames: n, knots});
    f += n;
  }
  return {fps, frames: f, duration: f / fps, chunks, hold: R.hold_s ?? 1.6, fade: R.fade_s ?? 0.4, capS: R.caption_s ?? 2.4, ease: R.ease ?? 0.15};
}
/* travel fraction x (0..1) -> story position p: velocity ramps up over the first `ease` of the travel and down over the
   last (smoothstep velocity), constant between; then the Watch-proportional knots of the chunk's beats */
function travelP(TL, c, x) {
  const e = Math.min(0.49, Math.max(1e-3, TL.ease)), S = t => t * t * t - t * t * t * t / 2, A = 1 - e;
  x = x < 0 ? 0 : x > 1 ? 1 : x;
  const pos = (x < e ? e * S(x / e) : x <= 1 - e ? e / 2 + (x - e) : A - e * S((1 - x) / e)) / A;
  const K = c.knots; let i = 1; while (i < K.length - 1 && pos > K[i].x) i++;
  const a = K[i - 1], b = K[i], t = (pos - a.x) / Math.max(1e-12, b.x - a.x);
  return Math.min(c.p1 - 1e-6 * (c.p1 - c.p0), a.p + (b.p - a.p) * (t < 0 ? 0 : t > 1 ? 1 : t));
}
/* frame index -> {chunk, k, t, u (0..1 of the travel, eased), p, fade (0 clear .. 1 black), cap (caption opacity)} */
function filmFrame(TL, fr) {
  fr = Math.max(0, Math.min(TL.frames - 1, fr));
  const k = TL.chunks.findIndex(c => fr >= c.f0 && fr < c.f1), c = TL.chunks[k];
  const t = (fr - c.f0) / TL.fps, s = c.frames / TL.fps;
  const travel = Math.max(1e-6, s - (c.card ? 0 : TL.hold)), u = clamp01(t / travel);
  const p = travelP(TL, c, u);
  const fin = k === 0 ? 0 : 1 - clamp01(t / TL.fade), fout = k === TL.chunks.length - 1 ? 0 : clamp01((t - (s - TL.fade)) / TL.fade);
  const cap = c.card ? 0 : clamp01((t - (s - TL.capS)) / 0.35) * (1 - clamp01((t - (s - TL.fade)) / TL.fade));
  return {chunk: c, k, t, u, p, fade: Math.max(fin, fout), cap};
}
/* chunk TF override at u: "preset" | [{u, preset}] | null -> {from, to, mix} | null */
function chunkTF(spec, u) {
  if (!spec) return null;
  if (typeof spec === "string") return {from: spec, to: spec, mix: 0};
  let i = 0; while (i < spec.length - 1 && u >= spec[i + 1].u) i++;
  const a = spec[i], b = spec[i + 1];
  if (!b || a.preset === b.preset) return {from: a.preset, to: a.preset, mix: 0};
  return {from: a.preset, to: b.preset, mix: smoother((u - a.u) / Math.max(1e-9, b.u - a.u))};
}
/* beats.json names presets the stage does not have (integration finding, U_film report): map them, never crash */
const TF_ALIAS = {HI: "ion:HI", OVI: "ion:OVI", composite: "phases", temperature: "phases"};
const aliasTF = tf => ({...tf, from: TF_ALIAS[tf.from] || tf.from, to: TF_ALIAS[tf.to] || tf.to});

async function boot() {
  const V = vars();
  if (V.layers === "stage") document.documentElement.classList.add("stage-only");
  if (V.w !== 1920 || V.h !== 1080) for (const el of [document.documentElement, document.body, root]) { el.style.width = V.w + "px"; el.style.height = V.h + "px"; }
  await window.__storyCss;
  const [film, beatsDoc, shotsDoc] = await Promise.all([get("film.json"), get("beats.json"), get("shots.json")]);
  // keys resolved in node by story_vtt.mjs --stamp (the copy lint's own renderer); raw copy.json is the fallback
  const copy = await get("build/film_copy.json").catch(() => get("copy.json"));
  const TL = filmTimeline(film, beatsDoc.beats, V.cut);
  if (V.cut === "beams" && !(film.cuts.beams && film.cuts.beams.enabled)) fail("the beams cut is disabled in film.json (its shots and captions are bound to the hero ray; see film.json cuts.beams.about)");

  // data: story-data/2 plus the decoded stored line (observed spectra), page fits and f_ion slice, as the page loads them
  const E = await import("./js/engine.js");

  // end card: title, URL, the honest-simplification list (DESIGN_final §3.7 "film end card")
  { const url = (copy.film && copy.film.url) || "tanmay-starslab.github.io/cgm-absorber-requirements/tng50/learn/how-a-spectrum-is-made/";
    card.querySelector(".t").textContent = (copy.film && copy.film.end_card_title) || "How a spectrum is made";
    card.querySelector(".u").textContent = url;
    card.querySelector(".hh").textContent = (copy.film && copy.film.honesty_heading) || "What we simplified";
    card.querySelector(".h").innerHTML = (copy.honesty || []).filter(s => !/\{\{/.test(s)).map(s => `<p>${esc(s)}</p>`).join(""); }

  let lastInfo = null;

    const F = filmFrame(TL, fr), c = F.chunk;

    const cardOn = !!c.card && V.layers !== "stage";
    card.style.display = cardOn ? "grid" : "none";
    // fit the card to the frame: the §3.7 list grew to 16 items and overflowed 1080 px at the plain 1920x1080 scale
    if (cardOn) { const box = card.firstElementChild, bw = box.offsetWidth || 1, bh = box.offsetHeight || 1;
      box.style.transform = `translate(-50%, -50%) scale(${Math.min(V.w / 1920, V.h / 1080, 0.92 * V.w / bw, 0.92 * V.h / bh).toFixed(4)})`; }
    if (cardOn) card.style.opacity = clamp01(F.t / 0.6).toFixed(3);

      const r = scene.captionAnchor();
      capEl.style.transform = `translate3d(${Math.round(r.x)}px,${Math.round(r.y + (1 - F.cap) * 10)}px,0)`;
      capEl.style.opacity = F.cap.toFixed(3);
    } else capEl.style.opacity = "0";
    fadeEl.style.opacity = (V.layers === "stage" ? 0 : F.fade).toFixed(3);
    lastInfo = {fr, chunk: c.id, p: +F.p.toFixed(6), beat: fs.beat.id, tf: fs.tf, l: +fs.l.toFixed(3), dock: fs.spec.dock, mode: fs.spec.mode, R: fs.spec.R, sn: fs.spec.sn};

    info: () => lastInfo, stats: () => scene.stats(),

}

/* ------------------------------------------------------------------ the composition (until js/main.js exports createScene) */
async function composeScene({V, film, data, copy, beatsDoc, shotsDoc, plot, fitjs}) {
  const T = await import("three");
  const [{createStage}, {probeGL}, RC, TFS, {loadManifestV2}] = await Promise.all([import("./js/stage/stage.js"), import("./js/stage/glcheck.js"),
    import("./js/stage/raycells.js"), import("./js/stage/tfstory.js"), import("../../js/vizdata.js")]);
  const R = film.render || {};

  /* film presets: base preset + overrides, registered on tfstory's PRESETS (tfstory.js itself is not edited) */
  for (const [id, sp] of Object.entries(film.presets || {})) {
    if (id === "about" || !sp || !sp.base) continue;
    const base = TFS.PRESETS[sp.base]; if (!base) fail(`film preset ${id}: unknown base ${sp.base}`);
    TFS.PRESETS[id] = {...base, ...(sp.gamma != null ? {gamma: sp.gamma} : {}), look: {...base.look, ...(sp.look || {})},
      state: () => ({...base.state(), ...(sp.state || {}), ...(sp.gamma != null ? {gamma: sp.gamma} : {})})};
  }

  /* geometry (story-data/2): ray, 672 cells in l order, the yt kernel table resampled onto raycells' (b/h, t) grid */
  const G = data.geometry, ray = {o: G.ray.p0.map((x, a) => x + G.ray.half * G.ray.n[a]), n: G.ray.n, half: G.ray.half};
  const C = G.cells, OV = data.ions.OVI.cells;
  const cells = C.idx.map((i, j) => ({i, idx: i, centre: [C.centre[3 * j], C.centre[3 * j + 1], C.centre[3 * j + 2]], h: C.h[j], d: C.d[j], l: C.lc[j],
    s_in: C.s_in[j], s_out: C.s_out[j], logT: Math.log10(OV.T[i])}));
