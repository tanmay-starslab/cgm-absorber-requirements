name: Bug report
description: Something on the site or in the code does not work as expected
labels: ["type: bug", "status: needs triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Explorer (spectra), Explorer (3D), Ask (chat), How an absorption spectrum is made, Detect & Resolve, Code or data pipeline, Other]
    validations: {required: true}
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The full address, including anything after ? or #
      placeholder: https://galaxies.tanmaysingh.uk/...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 18 on macOS, Chrome 131 on Android
    validations: {required: true}
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console errors
      description: Drag images in; for errors, open the browser console (F12) and paste any red lines
