name: Idea or feature request
description: Suggest something new or a better way to do something
labels: ["type: feature", "status: needs triage"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and what would it help you do?
    validations: {required: true}
  - type: textarea
    id: alt
    attributes:
      label: Alternatives or examples
      description: Anything similar you have seen elsewhere
