<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGM Mock-QSO Spectra · TNG50-1 sub-488530</title>
<style>
  :root{ --accent:#1D4E89; --ink:#1c2530; --muted:#6b7684; --line:#e2e6ea; --bg:#f6f8fa; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
        color:var(--ink); background:var(--bg); }
  header{ background:var(--accent); color:#fff; padding:12px 20px; font-size:18px; font-weight:600;
          display:flex; align-items:center; gap:12px; }
  header .sub{ font-weight:400; opacity:.85; font-size:14px; }
  .wrap{ display:flex; min-height:calc(100% - 48px); }
  .side{ width:320px; flex:0 0 320px; background:#fff; border-right:1px solid var(--line);
         padding:16px 16px 28px; overflow:auto; }
  .main{ flex:1; padding:14px 16px 24px; min-width:0; }
  h3{ color:var(--accent); font-size:13px; text-transform:uppercase; letter-spacing:.6px; margin:18px 0 8px; }
  h3:first-child{ margin-top:2px; }
  .ctl{ margin:10px 0; } .ctl label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .ctl .val{ color:var(--ink); font-weight:600; }
  select,input[type=range]{ width:100%; }
  select{ padding:6px; border:1px solid var(--line); border-radius:7px; background:#fff; font-size:13px; color:var(--ink); }
  input[type=range]{ accent-color:var(--accent); }
  .row{ display:flex; gap:8px; } .row>button{ flex:1; }
  button{ border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px;
          padding:8px 10px; font-size:13px; cursor:pointer; }
  button:hover{ border-color:var(--accent); color:var(--accent); }
  button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled{ opacity:.5; cursor:default; }
  .check{ display:flex; align-items:center; gap:8px; font-size:13px; margin:8px 0; cursor:pointer; }
  .divider{ height:1px; background:var(--line); margin:16px 0; }
  #status{ font-size:13px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 13px; margin-bottom:10px; }
  #status b{ color:var(--accent); }
  #plotwrap{ position:relative; background:#fff; border:1px solid var(--line); border-radius:9px; padding:6px; min-height:560px; }
  #plot{ width:100%; display:block; }
  #busy{ position:absolute; top:12px; right:14px; font-size:12px; color:var(--muted);
         background:#fff; padding:2px 8px; border-radius:6px; opacity:0; transition:opacity .15s; }
  #busy.on{ opacity:1; }
  #overlay{ position:fixed; inset:0; background:rgba(246,248,250,.96); display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:16px; z-index:50; text-align:center; padding:20px; }
  .spin{ width:42px; height:42px; border:4px solid #d5dde5; border-top-color:var(--accent);
         border-radius:50%; animation:sp 1s linear infinite; } @keyframes sp{ to{ transform:rotate(360deg); } }
  #ov-text{ color:var(--ink); font-size:15px; max-width:460px; line-height:1.5; }
  #ov-sub{ color:var(--muted); font-size:12.5px; max-width:460px; }
  @media (max-width:820px){ .wrap{ flex-direction:column; } .side{ width:100%; flex:none;
           border-right:none; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div id="overlay">
  <div class="spin"></div>
  <div id="ov-text">Starting the viewer…</div>
  <div id="ov-sub">The first time you open this, it downloads the plotting engine (a few seconds,
    needs internet). After that it runs locally.</div>
</div>
<header>CGM Mock-QSO Spectra <span class="sub">· TNG50-1 sub-488530 · O VI / Lyβ / C III</span></header>
<div class="wrap">
  <aside class="side">
    <h3>Sightline</h3>
    <label class="check"><input type="checkbox" id="showcaseOnly"> ★ showcase only (multi-component, unsaturated)</label>
    <select id="gallery" size="12"></select>
    <div class="row" style="margin-top:8px;"><button id="prev">◀ prev</button><button id="next">next ▶</button></div>
    <div class="divider"></div>
    <h3>Instrument</h3>
    <div class="ctl"><label>R — columns 1 &amp; 3: <span class="val" id="rloV">20000</span></label><select id="rlo"></select></div>
    <div class="ctl"><label>R — columns 2 &amp; 4: <span class="val" id="rhiV">40000</span></label><select id="rhi"></select></div>
    <div class="ctl"><label>S/N — columns 1 &amp; 2: <span class="val" id="snhiV">8</span></label><input type="range" id="snhi" min="2" max="20" step="1" value="8"></div>
    <div class="ctl"><label>S/N — columns 3 &amp; 4: <span class="val" id="snloV">5</span></label><input type="range" id="snlo" min="2" max="20" step="1" value="5"></div>
    <div class="ctl"><label>velocity window ± [km/s]: <span class="val" id="vwinV">400</span></label><input type="range" id="vwin" min="150" max="800" step="50" value="400"></div>
    <label class="check"><input type="checkbox" id="intrinsic"> show intrinsic (unconvolved) spectrum</label>
    <div class="row" style="margin-top:8px;"><button id="reroll">↻ new noise</button><button id="dl" class="primary">⬇ PNG</button></div>
  </aside>
  <main class="main">
    <div id="status"></div>
    <div id="plotwrap"><div id="busy">rendering…</div><img id="plot" alt="spectra"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
<script>window.PYFILES=__PY_FILES__;</script>
<script>window.DATA=__DATA_JSON__;</script>
<script>
const DATA=window.DATA, META=DATA.meta, SL=DATA.sightlines, R_OPTS=[20000,30000,40000,60000,80000,100000];
let py=null, render=null, curIdx=0, noiseBase=0, rendering=false, pending=false;
const $=id=>document.getElementById(id);

const DRIVER = `
import sys, json, io, base64
sys.path.insert(0,'/home/pyodide')
import numpy as np, matplotlib
matplotlib.use('Agg')
import matplotlib.pyplot as plt
import cgm_style as CS, make_publication_figure as MPF
CS.set_style(usetex=False, base=13)
from js import DATA as JS
META=JS.meta.to_py(); IONKEYS=[im['key'] for im in META['ions']]
REST={im['key']:im['rest'] for im in META['ions']}
LAM={im['key']:np.frombuffer(base64.b64decode(im['lam']),dtype='<f4').astype(float) for im in META['ions']}
_tc={}
def _tau(i,key):
    k=(i,key)
    if k not in _tc:
        s=str(getattr(JS.sightlines[i].tau,key))
        _tc[k]=np.frombuffer(base64.b64decode(s),dtype='<f2').astype(float)
    return _tc[k]
def render(i,Rlo,Rhi,SNhi,SNlo,vwin,seed,intr,dpi):
    sl=JS.sightlines[i]; vsys=float(sl.vsys)
    data={'v_sys':vsys,'geom':json.dumps({'orientation':str(sl.orient),'b_kpc':float(sl.b),'azimuth_deg':float(sl.az),'v_sys_kms':vsys})}
    for key in IONKEYS:
        data[key+'_lambda']=LAM[key]; data[key+'_tau']=_tau(i,key); data[key+'_rest']=REST[key]
    fig,_=MPF.build_figure(data,Rlo=int(Rlo),Rhi=int(Rhi),SNhi=int(SNhi),SNlo=int(SNlo),vwin=float(vwin),seed=int(seed),show_intrinsic=bool(intr))
    buf=io.BytesIO(); fig.savefig(buf,format='png',dpi=int(dpi)); plt.close(fig)
    return base64.b64encode(buf.getvalue()).decode()
`;

async function boot(){
  try{
    $('ov-text').textContent='Starting the viewer…';
    py=await loadPyodide();
    $('ov-text').textContent='Loading the plotting engine (numpy · matplotlib · astropy)…';
    await py.loadPackage(['numpy','matplotlib','astropy']);
    for(const [name,src] of Object.entries(window.PYFILES)) py.FS.writeFile('/home/pyodide/'+name,src);
    $('ov-text').textContent='Preparing figures…';
    py.runPython(DRIVER);
    render=py.globals.get('render');
    initControls(); fillGallery();
    $('overlay').style.display='none';
    draw();
  }catch(e){
    $('ov-text').textContent='Could not start the viewer.';
    $('ov-sub').textContent='This viewer needs an internet connection the first time it is opened. '
      +'Please connect and reload. ('+e+')';
  }
}

function initControls(){
  R_OPTS.forEach(v=>{ [$('rlo'),$('rhi')].forEach(el=>{ const o=document.createElement('option');
    o.value=v; o.textContent=v.toLocaleString(); el.appendChild(o); }); });
  $('rlo').value=20000; $('rhi').value=40000;
  const sync=()=>{ $('rloV').textContent=(+$('rlo').value).toLocaleString();
    $('rhiV').textContent=(+$('rhi').value).toLocaleString();
    $('snhiV').textContent=$('snhi').value; $('snloV').textContent=$('snlo').value;
    $('vwinV').textContent=$('vwin').value; };
  ['rlo','rhi','snhi','snlo','vwin'].forEach(id=>{
    $(id).addEventListener('input',sync);
    $(id).addEventListener('change',()=>{ sync(); draw(); }); });
  $('intrinsic').addEventListener('change',draw);
  $('gallery').addEventListener('change',()=>{ curIdx=+$('gallery').value; draw(); });
  $('showcaseOnly').addEventListener('change',()=>{ fillGallery(); draw(); });
  $('prev').onclick=()=>step(-1); $('next').onclick=()=>step(1);
  $('reroll').onclick=()=>{ noiseBase=(noiseBase+1)%100000; draw(); };
  $('dl').onclick=downloadPNG;
  sync();
}
function labelOf(s){ const t={'face-on':'face','edge-on':'edge','random':'rand'}[s.orient]||s.orient;
  const star=s.star===2?'★ ':s.star===1?'☆ ':''; return `${star}${t}  b=${s.b} kpc  Φ=${s.az}°`; }
function fillGallery(){ const only=$('showcaseOnly').checked, g=$('gallery'); g.innerHTML='';
  SL.forEach((s,i)=>{ if(only&&s.star===0) return; const o=document.createElement('option');
    o.value=i; o.textContent=labelOf(s); g.appendChild(o); });
  if(![...g.options].some(o=>+o.value===curIdx)) curIdx=g.options.length?+g.options[0].value:0;
  g.value=curIdx; }
function step(d){ const opts=[...$('gallery').options]; if(!opts.length) return;
  let i=opts.findIndex(o=>+o.value===curIdx); if(i<0)i=0; i=(i+d+opts.length)%opts.length;
  curIdx=+opts[i].value; $('gallery').value=curIdx; draw(); }

function params(dpi){ return [curIdx,+$('rlo').value,+$('rhi').value,+$('snhi').value,+$('snlo').value,
  +$('vwin').value,noiseBase,$('intrinsic').checked,dpi]; }
async function draw(){
  if(!render) return;
  if(rendering){ pending=true; return; }
  rendering=true; $('busy').classList.add('on');
  await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
  try{ const b64=render(...params(96)); $('plot').src='data:image/png;base64,'+b64; setStatus(); }
  catch(e){ $('status').innerHTML='<b>Error:</b> '+e; }
  rendering=false; $('busy').classList.remove('on');
  if(pending){ pending=false; draw(); }
}
function setStatus(){ const s=SL[curIdx], L=s.logN, vs=Math.round(s.vsys);
  $('status').innerHTML=`<b>${s.id}</b> &nbsp;|&nbsp; ${s.orient}, b = <b>${s.b} kpc</b>, `+
    `Φ = <b>${s.az}°</b>, <i>v</i><sub>sys</sub> = <b>${vs>=0?'+':''}${vs} km/s</b> &nbsp;|&nbsp; `+
    `log <i>N</i>: O VI <b>${L.OVI}</b>, H I <b>${L.HILyb}</b>, C III <b>${L.CIII}</b>`; }
function downloadPNG(){ if(!render) return; const b64=render(...params(200));
  const a=document.createElement('a'); a.href='data:image/png;base64,'+b64;
  a.download='cgm_'+SL[curIdx].id+'.png'; a.click(); }

boot();
</script>
</body>
</html>
